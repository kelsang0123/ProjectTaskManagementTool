# This workflow is triggered on push to the main branch and on pull requests
# to the main branch. It runs all tests, builds a Docker image, and deploys
# the test coverage report to GitHub Pages.
name: Validate pull requests to main

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  run_tests:
    name: Compile application and run tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          java-version: '21'
          cache: maven

      - name: Compile and run tests
        working-directory: MainBackendServer
        run: mvn --batch-mode clean verify